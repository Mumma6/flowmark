services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flowmark
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: flowmark
    ports:
      - "127.0.0.1:${FLOWMARK_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    labels:
      io.flowmark.checkout: "${FLOWMARK_INFRA_CHECKOUT:?Use pnpm infra up}"
      io.flowmark.purpose: development-postgres
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "flowmark",
          "-d",
          "flowmark",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    stop_grace_period: 10s

volumes:
  postgres-data:
    labels:
      io.flowmark.checkout: "${FLOWMARK_INFRA_CHECKOUT:?Use pnpm infra up}"
      io.flowmark.purpose: development-postgres
      io.flowmark.postgres-major: "18"
