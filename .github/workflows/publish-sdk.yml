name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (alpha or latest)
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
  push:
    tags:
      - "sdk-v*"

# Required for npm Trusted Publishing (OIDC).
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @flowmarkdev/core and @flowmarkdev/node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: pnpm

      - name: Install npm CLI for OIDC
        run: npm install -g npm@11.15.0

      - name: Prove OIDC is available
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
            || (echo "ACTIONS_ID_TOKEN_REQUEST_URL missing; id-token: write not effective" && exit 1)
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
            || (echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN missing" && exit 1)
          npm --version
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @flowmarkdev/core... --filter @flowmarkdev/node... build

      - name: Test packages
        run: |
          pnpm --filter @flowmarkdev/core test
          pnpm --filter @flowmarkdev/node test

      - name: Resolve dist-tag
        id: dist
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack with pnpm (rewrite workspace:*)
        run: |
          mkdir -p "$RUNNER_TEMP/flowmark-packs"
          pnpm --filter @flowmarkdev/core pack --pack-destination "$RUNNER_TEMP/flowmark-packs"
          pnpm --filter @flowmarkdev/node pack --pack-destination "$RUNNER_TEMP/flowmark-packs"

      - name: Publish @flowmarkdev/core via OIDC
        run: |
          rm -rf "$RUNNER_TEMP/flowmark-publish-core"
          mkdir -p "$RUNNER_TEMP/flowmark-publish-core"
          tar -xzf "$RUNNER_TEMP/flowmark-packs"/flowmarkdev-core-*.tgz \
            -C "$RUNNER_TEMP/flowmark-publish-core" --strip-components=1
          cd "$RUNNER_TEMP/flowmark-publish-core"
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Publish @flowmarkdev/node via OIDC
        run: |
          rm -rf "$RUNNER_TEMP/flowmark-publish-node"
          mkdir -p "$RUNNER_TEMP/flowmark-publish-node"
          tar -xzf "$RUNNER_TEMP/flowmark-packs"/flowmarkdev-node-*.tgz \
            -C "$RUNNER_TEMP/flowmark-publish-node" --strip-components=1
          cd "$RUNNER_TEMP/flowmark-publish-node"
          node -e 'const d=require("./package.json").dependencies; if(JSON.stringify(d).includes("workspace:")) {console.error(d); process.exit(1)}'
          unset NODE_AUTH_TOKEN
          npm publish --access public --tag "${{ steps.dist.outputs.tag }}"

      - name: Reminder
        run: |
          echo "If npm staged the release, approve both packages (core first) on npmjs.com."
