name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag (alpha or latest)
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @flowmarkdev/core and @flowmarkdev/node
    runs-on: ubuntu-latest
    # Do not set `environment` unless the same name is configured on the
    # npm Trusted Publisher (OIDC claim must match).
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.14"
          cache: pnpm
          # Do not set registry-url here: it injects a placeholder
          # NODE_AUTH_TOKEN that blocks npm trusted publishing (OIDC).

      - name: Install npm CLI for OIDC
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @flowmarkdev/core... --filter @flowmarkdev/node... build

      - name: Test packages
        run: |
          pnpm --filter @flowmarkdev/core test
          pnpm --filter @flowmarkdev/node test

      - name: Resolve dist-tag
        id: dist
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack packages with rewritten workspace deps
        run: |
          mkdir -p "$RUNNER_TEMP/flowmark-packs"
          pnpm --filter @flowmarkdev/core pack --pack-destination "$RUNNER_TEMP/flowmark-packs"
          pnpm --filter @flowmarkdev/node pack --pack-destination "$RUNNER_TEMP/flowmark-packs"
          tar -xOf "$RUNNER_TEMP/flowmark-packs"/flowmarkdev-node-*.tgz package/package.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const d=JSON.parse(s).dependencies; if(JSON.stringify(d).includes("workspace:")) {console.error(d); process.exit(1)}; console.log("packed-deps-ok", d)})'

      # Pack via pnpm (rewrites workspace:*), publish via npm so OIDC trusted
      # publishing is used. Clear any leftover token so npm does not prefer it.
      - name: Publish @flowmarkdev/core
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm publish "$RUNNER_TEMP/flowmark-packs"/flowmarkdev-core-*.tgz \
            --access public \
            --tag "${{ steps.dist.outputs.tag }}"

      - name: Publish @flowmarkdev/node
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm publish "$RUNNER_TEMP/flowmark-packs"/flowmarkdev-node-*.tgz \
            --access public \
            --tag "${{ steps.dist.outputs.tag }}"

      - name: Reminder
        run: |
          echo "If npm staged the release, approve both packages (core first) on npmjs.com."
          echo "Trusted Publisher validates after the first successful OIDC publish from this workflow."
