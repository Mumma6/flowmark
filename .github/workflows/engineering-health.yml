name: Engineering learning evidence

on:
  push:
    branches: [staging]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Runs trusted, committed tooling only. No PR checkout, build, secrets or writes.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: engineering-learning
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Collect cross-PR learning evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/factory-learning.mjs
      - name: Retain evidence and proposals for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-learning-${{ github.run_id }}
          path: |
            .factory-reports/learning.json
            .factory-reports/learning.md
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
