name: Pull request verification

# Application, Rust and WASM jobs must not receive hosted credentials.
# Integration uses only its disposable local service database.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/rust/cargo
  RUSTUP_HOME: ${{ github.workspace }}/.cache/rust/rustup

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, and test
    needs: [application, rust, wasm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Preserve the existing required status while making every language gate it.
      - name: Require application, Rust and WASM checks
        run: |
          test "${{ needs.application.result }}" = success
          test "${{ needs.rust.result }}" = success
          test "${{ needs.wasm.result }}" = success

  application:
    name: TypeScript format, lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache Rust build tools
        uses: ./.github/actions/cache-rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format, lint, typecheck, and unit tests
        run: pnpm check:typescript

  rust:
    name: Rust format, Clippy, tests and properties
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

          # This job never installs npm packages, so no pnpm store is created.
          package-manager-cache: false

      - name: Cache Rust tools
        uses: ./.github/actions/cache-rust
        with:
          variant: native

      - name: Check native Rust
        run: pnpm rust:check

  wasm:
    name: WASM production compatibility (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache Rust build tools
        uses: ./.github/actions/cache-rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server and verify traced WASM artifact
        run: pnpm engine:verify-build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: flowmark_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: flowmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmark_ci -d flowmark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://flowmark_ci:local_ci_only@127.0.0.1:5432/flowmark_test
      DATABASE_URL: postgresql://flowmark_ci:local_ci_only@127.0.0.1:5432/flowmark_test
      DATABASE_MIGRATION_URL: postgresql://flowmark_ci:local_ci_only@127.0.0.1:5432/flowmark_test
      FLOWMARK_TEST_DATABASE_SOURCE: ci-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cache Rust build tools
        uses: ./.github/actions/cache-rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, migrate, run both suites, and verify complete reports
        run: pnpm test:integration --ci-service
