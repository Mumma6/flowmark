[workspace]
members = ["crates/flowmark-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
